summary = "Historique du presse-papiers"
description = """ClipHistory suit l'activité du presse-papiers, en enregistrant automatiquement les entrées de texte et HTML dans un stockage persistant. Les fonctionnalités incluent une boîte de dialogue d'historique accessible, l'épinglage, des noms d'éléments personnalisés, l'édition, la réorganisation, la suppression d'éléments et la prise en charge du collage pour NVDA.

Raccourcis clavier :
Windows+V
Simple : ouvrir la boîte de dialogue ClipHistory
Double : Effacer tout l'historique du presse-papiers"""