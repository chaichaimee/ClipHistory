summary = "क्लिपबोर्ड इतिहास"
description = """क्लिपबोर्ड इतिहास (क्लिपहिस्ट्री) क्लिपबोर्ड गतिविधियों को ट्रैक करता है, जो टेक्स्ट और एचटीएमएल प्रविष्टियों को स्वचालित रूप से स्थायी भंडारण में सहेजता है। इसमें एक सुलभ इतिहास संवाद, पिन करना, कस्टम आइटम नाम, संपादन, पुनर्व्यवस्थित करना, आइटम हटाना और एनवीडीए के लिए पेस्ट समर्थन जैसी विशेषताएं शामिल हैं।

हॉटकी:
विंडोज+वी
एकल: क्लिपहिस्ट्री संवाद खोलें
डबल: सभी क्लिपबोर्ड इतिहास साफ़ करें"""