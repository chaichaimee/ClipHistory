summary = "क्लिपबोर्ड इतिहास"
description = """क्लिपबोर्ड इतिहास (क्लिपहिस्ट्री) क्लिपबोर्ड गतिविधियों को ट्रैक करता है, और टेक्स्ट और एचटीएमएल प्रविष्टियों को स्वचालित रूप से स्थायी स्टोरेज में सहेजता है। इसमें एक सुलभ इतिहास संवाद, पिन करना, कस्टम आइटम नाम, संपादन, पुनः क्रमित करना, आइटम हटाना और NVDA के लिए पेस्ट करने का समर्थन जैसी सुविधाएँ शामिल हैं।

हॉट कीज़:
Windows+V
सिंगल: क्लिपहिस्ट्री संवाद खोलें
डबल: सभी क्लिपबोर्ड इतिहास साफ़ करें"""