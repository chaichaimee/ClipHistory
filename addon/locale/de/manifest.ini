summary = "Zwischenablageverlauf"
description = """ClipHistory zeichnet die Aktivitäten der Zwischenablage auf und speichert Text- und HTML-Einträge automatisch in einem dauerhaften Speicher. Zu den Funktionen gehören ein barrierefreier Verlaufsdialog, das Anheften, benutzerdefinierte Elementnamen, Bearbeiten, Umsortieren, Löschen von Elementen und Unterstützung zum Einfügen für NVDA.

Tastenkombinationen:
Windows+V
Einfach: ClipHistory-Dialog öffnen
Doppelt: Gesamten Zwischenablageverlauf löschen"""