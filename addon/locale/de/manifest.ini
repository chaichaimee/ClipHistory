summary = "Zwischenablageverlauf"
description = """ClipHistory zeichnet die Aktivität der Zwischenablage auf und speichert Text- und HTML-Einträge automatisch dauerhaft. Zu den Funktionen gehören ein barrierefreier Verlaufsdialog, das Anheften, benutzerdefinierte Elementnamen, Bearbeiten, Neuanordnen, Löschen von Elementen und Unterstützung beim Einfügen für NVDA.

Tastenkombinationen:
Windows+V
Einfach: ClipHistory-Dialog öffnen
Doppelt: Gesamten Zwischenablageverlauf löschen"""