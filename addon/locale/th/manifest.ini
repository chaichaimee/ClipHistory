summary = "ประวัติคลิปบอร์ด"
description = """ClipHistory ติดตามกิจกรรมของคลิปบอร์ด โดยจะบันทึกรายการข้อความและ HTML ลงในที่จัดเก็บถาวรโดยอัตโนมัติ ฟีเจอร์ต่างๆ ได้แก่ กล่องโต้ตอบประวัติที่เข้าถึงได้, การปักหมุด, การตั้งชื่อรายการเอง, การแก้ไข, การจัดเรียงใหม่, การลบรายการ และการรองรับการวางสำหรับ NVDA

ปุ่มลัด:
Windows+V
กดครั้งเดียว: เปิดกล่องโต้ตอบ ClipHistory
ดับเบิลคลิก: ล้างประวัติคลิปบอร์ดทั้งหมด"""