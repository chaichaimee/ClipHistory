summary = "ประวัติคลิปบอร์ด"
description = """ClipHistory ติดตามกิจกรรมของคลิปบอร์ด โดยบันทึกข้อความและรายการ HTML ลงในที่จัดเก็บข้อมูลถาวรโดยอัตโนมัติ คุณสมบัติต่างๆ รวมถึงกล่องโต้ตอบประวัติที่เข้าถึงได้, การปักหมุด, ชื่อรายการกำหนดเอง, การแก้ไข, การจัดเรียงใหม่, การลบรายการ และการรองรับการวางสำหรับ NVDA

ปุ่มลัด:
Windows+V
กดครั้งเดียว: เปิดกล่องโต้ตอบ ClipHistory
ดับเบิลคลิก: ล้างประวัติคลิปบอร์ดทั้งหมด"""