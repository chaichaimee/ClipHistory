summary = "Історія буфера обміну"
description = """ClipHistory відстежує активність буфера обміну, автоматично зберігаючи текстові та HTML-записи у постійне сховище. Серед функцій: доступне вікно історії, закріплення, власні назви елементів, редагування, зміна порядку, видалення елементів та підтримка вставки для NVDA.

Гарячі клавіші:
Windows+V
Одиночне: відкрити діалогове вікно ClipHistory
Подвійне: очистити всю історію буфера обміну"""