summary = "История буфера обмена"
description = """ClipHistory отслеживает активность буфера обмена, автоматически сохраняя текстовые и HTML-записи в постоянное хранилище. Функции включают доступный диалог истории, закрепление, пользовательские имена элементов, редактирование, изменение порядка, удаление элементов и поддержку вставки для NVDA.

Горячие клавиши:
Windows+V
Одиночное нажатие: открыть диалог ClipHistory
Двойное нажатие: очистить всю историю буфера обмена"""