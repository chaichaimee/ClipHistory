summary = "Histórico da área de transferência"
description = """O ClipHistory monitora a atividade da área de transferência, salvando automaticamente entradas de texto e HTML em armazenamento persistente. Os recursos incluem uma caixa de diálogo de histórico acessível, fixação, nomes de itens personalizados, edição, reordenação, exclusão de itens e suporte a colagem para o NVDA.

Teclas de atalho:
Windows+V
Simples: abrir a caixa de diálogo do ClipHistory
Duplo: limpar todo o histórico da área de transferência"""