summary = "Riwayat Klipboard"
description = """ClipHistory melacak aktivitas klipboard, secara otomatis menyimpan teks dan entri HTML ke penyimpanan permanen. Fitur mencakup dialog riwayat yang dapat diakses, penyematan, nama item kustom, pengeditan, penyusunan ulang, penghapusan item, dan dukungan penempelan untuk NVDA.

Tombol Pintas:
Windows+V
Tunggal: buka Dialog ClipHistory
Ganda: Hapus Semua Riwayat Klipboard"""