name = ClipHistory
summary = "ClipboardHistory"
description = """ClipHistory tracks clipboard activity, automatically saving text and HTML entries to persistent storage. Features include an accessible history dialog, pinning, custom item names, editing, reordering, item deletion, and pasting support for NVDA.

Hot Keys:
Windows+V
Single : open ClipHistory Dialog
Double : Clear All ClipBoardHistory"""
author = "Chai Chaimee <chaicm75@gmail.com>"
url = https://github.com/chaichaimee/ClipHistory
version = 2026.11.0
changelog = """Fixed rich text paste: the HTML clipboard header had wrong fragment offsets, so pasting from Word or Thunderbird inserted the raw header text. Offsets now use UTF-8 bytes, which also fixes non-ASCII text. The history list now shows plain text without HTML tags. html_to_text also drops comments, style and script blocks. Moved plugin logic from __init__.py into clipCore.py."""
docFileName = readme.html
minimumNVDAVersion = 2025.1.0
lastTestedNVDAVersion = 2026.3.0
updateChannel = None
